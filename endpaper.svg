<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Endpaper tile for the real-book reader: faded French-blue fleur-de-lis on cream, set on a half-drop. -->
  <defs>
    <g id="lily">
      <!-- centre petal -->
      <path d="M0 -24 C -6.5 -16, -8.2 -6, -3.2 6 L 3.2 6 C 8.2 -6, 6.5 -16, 0 -24 Z"/>
      <!-- side petals: rise out from the band, curl over and hook down -->
      <path d="M-3.4 6.2 C -9 2.4, -14.6 -3, -19 -7.4 C -23.4 -11.6, -27.4 -7.2, -25.8 -2.2 C -24.6 1.6, -20.2 3, -17.6 0.4 C -20 0.2, -21.2 -2, -19.8 -3.6 C -18 -5.2, -14.4 -2.6, -11.6 1.2 C -9.4 4.2, -7.6 7, -6.8 8.4 Z"/>
      <path d="M3.4 6.2 C 9 2.4, 14.6 -3, 19 -7.4 C 23.4 -11.6, 27.4 -7.2, 25.8 -2.2 C 24.6 1.6, 20.2 3, 17.6 0.4 C 20 0.2, 21.2 -2, 19.8 -3.6 C 18 -5.2, 14.4 -2.6, 11.6 1.2 C 9.4 4.2, 7.6 7, 6.8 8.4 Z"/>
      <!-- band -->
      <rect x="-9" y="7" width="18" height="4.2" rx="1.6"/>
      <!-- foot -->
      <path d="M-2.6 11.6 C -3.4 15.4, -6.2 18.4, -9.6 19.2 C -6 20.6, -2.2 19, 0 15.6 C 2.2 19, 6 20.6, 9.6 19.2 C 6.2 18.4, 3.4 15.4, 2.6 11.6 Z"/>
    </g>
    <g id="dot"><circle r="1.6"/></g>
  </defs>
  <rect width="120" height="120" fill="#f1e6cd"/>
  <g fill="#bfc8e0">
    <use href="#lily" x="30" y="32"/>
    <use href="#lily" x="90" y="92"/>
    <use href="#lily" x="90" y="-28"/>
    <use href="#lily" x="-30" y="92"/>
    <use href="#lily" x="150" y="92"/>
    <use href="#lily" x="30" y="152"/>
  </g>
  <g fill="#d9bf86">
    <use href="#dot" x="90" y="30"/>
    <use href="#dot" x="30" y="90"/>
  </g>
</svg>
