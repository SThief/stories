<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="chars.js"></script><script src="world.js"></script><script src="scenes.js"></script>
<script src="timeline.js"></script><script src="dialogue.js"></script>
<script src="look.js"></script>
<script>
// The cartoon: each page's scene, told by the narrator with the characters' own voices for their heart lines, like
// The Boy Who Changed His Stars. The camera follows the story, not the speaker: each line in script.json may set a
// shot (wide, mid, close, two, or a fixed spot), and the camera cuts to it, or glides there over `move` seconds, then
// creeps slowly closer while it holds. A line may also set moods, cues, rising hearts, or a sepia memory circle.
// A character's name shows the first time they speak.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mk = () => { const o = document.createElement('canvas'); o.width = 1920; o.height = 1080; return o; };
const off = [mk(), mk()], raw = mk(), mem = mk();
const DL = DIALOGUE, OLD = TIMELINE.pages, HEADS_BY = DL.scenes.map(() => ({}));
const opts = l => (l && l.opts) || {};
const FIRST = {}; DL.scenes.forEach((s, i) => s.lines.forEach((l, j) => { if (l.who !== 'narrator' && !FIRST[l.who]) FIRST[l.who] = [i, j]; }));
// watercolor paper: fine grain and a few soft uneven washes, multiplied over every frame
const paper = mk(); (() => { const g = paper.getContext('2d'), R = rng(42); g.fillStyle = '#fbf6ec'; g.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 160; i++) { const x = R() * 1920, y = R() * 1080, r = 60 + R() * 300; g.fillStyle = rad(g, x, y, 0, r, [[0, `rgba(${200 + R() * 40},${170 + R() * 40},${130 + R() * 40},.07)`], [1, 'rgba(255,255,255,0)']]); g.fillRect(x - r, y - r, r * 2, r * 2); }
  const im = g.getImageData(0, 0, 1920, 1080), d = im.data; for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(im, 0, 0);
  g.globalAlpha = .08; g.strokeStyle = '#8a7050'; g.lineWidth = 1; for (let i = 0; i < 900; i++) { const x = R() * 1920, y = R() * 1080, a = R() * TAU, l = 6 + R() * 18; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } })();

const WIDE = { x: 960, y: 540, z: 1 };
const PUSH = { rate: .016, max: .12 };   // while a shot holds, the camera creeps closer: 1.6% a second, up to 12%
const SNAP = {};   // where a line's subject stood when the line began, so a close-up doesn't bob with a walk
function head(i, k, who, track) {
  const h = HEADS_BY[i][who]; if (track || !h) return h;
  const key = `${i}:${k}:${who}`; return SNAP[key] || (SNAP[key] = { ...h });
}
function shotSpec(i, k, o) {
  if (o.shot === 'wide') return WIDE;
  if (o.shot === 'at') return { x: o.x, y: o.y, z: o.z };
  const hs = [].concat(o.on).map(w => head(i, k, w, o.track)); if (hs.some(h => !h)) return null;
  if (o.shot === 'two') {   // both faces in frame, framed from the chest up
    const xs = hs.map(h => h.x), span = Math.max(...xs) - Math.min(...xs), s = Math.max(...hs.map(h => h.s));
    return { x: (Math.max(...xs) + Math.min(...xs)) / 2, y: hs.reduce((m, h) => m + h.y, 0) / hs.length + (o.dy ?? 170) * s,
      z: o.z || clamp(1920 * .6 / (span + 520 * s), 1.15, 1.9) };
  }
  const h = hs[0], close = o.shot === 'close';
  return { x: h.x, y: h.y + (o.dy ?? (close ? 110 : 170)) * h.s, z: o.z || (close ? 2.1 : 1.65) };
}
function frameShot(s) {   // keep the view inside the picture
  const hw = 960 / s.z, hh = 540 / s.z;
  return { x: clamp(s.x, hw, 1920 - hw), y: clamp(s.y, hh, 1080 - hh), z: s.z };
}
function lineAt(sc, u) { let k = -1; sc.lines.forEach((l, j) => { if (u >= l.start) k = j; }); return k; }
function camAt(c, u) {   // where shot c puts the camera at time u: the glide in, then the slow push
  const held = Math.max(0, u - c.at - c.move), z = c.s.z * (1 + Math.min(PUSH.max, held * PUSH.rate * (c.s.z > 1.01 ? 1 : .5)));
  const to = { ...c.s, z }, e = c.move ? ease((u - c.at) / c.move) : 1;
  return frameShot(c.from ? { x: lerp(c.from.x, to.x, e), y: lerp(c.from.y, to.y, e), z: lerp(c.from.z, to.z, e) } : to);
}
function camera(i, u) {
  const sc = DL.scenes[i]; let c = { s: WIDE, at: 0, move: 0, from: null };
  sc.lines.forEach((l, k) => { const o = opts(l); if (l.start > u || !o.shot) return;
    const s = shotSpec(i, k, o); if (!s) return;
    c = { s: frameShot(s), at: l.start, move: o.move || 0, from: o.move ? camAt(c, l.start) : null }; });
  return camAt(c, u);
}
// the scene's action keeps its own pacing; each line's `act` pins it to that moment of the action (in the old timing)
function oldTime(i, u) {
  const sc = DL.scenes[i], old = OLD[i].dur, pts = [[0, 0], ...sc.lines.filter(l => opts(l).act != null).map(l => [l.start, opts(l).act]), [sc.dur, old]];
  for (let j = 1; j < pts.length; j++) if (u <= pts[j][0] || j === pts.length - 1) {
    const [a0, b0] = pts[j - 1], [a1, b1] = pts[j]; return b0 + (b1 - b0) * clamp((u - a0) / Math.max(.01, a1 - a0), 0, 1e9); }
}
const FILM_AT = {};   // the film time (from the scene's start) at which the scene's action reaches moment o
function filmAt(i, o) {
  const key = i + ':' + o; if (key in FILM_AT) return FILM_AT[key];
  let a = 0, b = DL.scenes[i].dur; for (let n = 0; n < 40; n++) { const m = (a + b) / 2; if (oldTime(i, m) < o) a = m; else b = m; }
  return FILM_AT[key] = b;
}
function setCue(o) { CUE.mood = o.mood || {}; CUE.on = Object.fromEntries((o.cue || []).map(n => [n, true])); }
function heartShape(c, x, y, r) {
  c.beginPath(); c.moveTo(x, y + r * .9);
  c.bezierCurveTo(x - r * 1.6, y - r * .1, x - r * .8, y - r * 1.3, x, y - r * .45);
  c.bezierCurveTo(x + r * .8, y - r * 1.3, x + r * 1.6, y - r * .1, x, y + r * .9); c.closePath();
}
function hearts(c, i, k, L, u) {   // little hearts rising from the subject's head, in scene coordinates
  const o = opts(L), shot = o.shot === 'two', who = o.heartsOn || [].concat(o.on || L.who);
  const hs = who.map(w => HEADS_BY[i][w]).filter(Boolean); if (!hs.length) return;
  const src = shot ? [{ x: hs.reduce((m, h) => m + h.x, 0) / hs.length, y: Math.min(...hs.map(h => h.y)), s: hs[0].s }] : hs;
  const e = u - L.start;
  src.forEach((h, n) => { for (let j = 0; j < 5; j++) {
    const q = (e - j * .45 - n * .2) / 2.4; if (q < 0) continue; const f = q % 1, a = clamp(f * 5) * clamp((1 - f) * 2.5);
    const x = h.x + Math.sin(j * 2.3 + f * 4) * 46 * h.s + (j - 2) * 22 * h.s, y = h.y - 70 * h.s - f * 230 * h.s, r = (18 + j % 3 * 5) * h.s;
    c.save(); c.globalAlpha = a; heartShape(c, x, y, r); c.fillStyle = '#ff6f91'; c.fill(); ink(c, 3); c.stroke(); c.restore(); } });
}
function memory(g, L, u) {   // a sepia memory in a circle over a soft cream veil, like The Boy Who Changed His Stars
  const m = opts(L).memory, a = Math.min(clamp((u - L.start) / .5), clamp((L.start + L.dur + .3 - u) / .5)); if (!m || a <= 0) return;
  const saved = { who: SPEAK.who, amp: SPEAK.amp, roar: SPEAK.roar, mood: CUE.mood, on: CUE.on, heads: HEADS, inv: CAM_INV };
  SPEAK.who = m.speak || null; SPEAK.amp = m.speak ? .8 : 0; SPEAK.roar = !!m.speak; setCue({ cue: m.cue }); CAM_INV = null; HEADS = {};
  const r = mem.getContext('2d'); r.setTransform(1, 0, 0, 1, 0, 0); SCENES[m.page](r, L.start + 1000, m.u, OLD[m.page].dur); r.setTransform(1, 0, 0, 1, 0, 0);
  Object.assign(SPEAK, { who: saved.who, amp: saved.amp, roar: saved.roar }); CUE.mood = saved.mood; CUE.on = saved.on; HEADS = saved.heads; CAM_INV = saved.inv;
  const R = 380 * (.86 + .14 * ease(a)), cx = 960, cy = 470, sc = 2 * R / 1080 * 1.08;
  g.save(); g.globalAlpha = a * .85; g.fillStyle = '#f6ead2'; g.fillRect(0, 0, 1920, 1080); g.globalAlpha = a;
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.save(); g.clip(); g.filter = 'sepia(.85) saturate(.9) brightness(1.06)';
  g.drawImage(mem, cx - 960 * sc, cy - 540 * sc, 1920 * sc, 1080 * sc); g.filter = 'none'; g.restore();
  g.lineWidth = 12; g.strokeStyle = '#8a5a32'; g.stroke(); g.restore();
}
function drawPage(cnv, i, t, live) {
  const sc = DL.scenes[i], u = t - sc.start, k = lineAt(sc, u), L = k >= 0 ? sc.lines[k] : null;
  const speaking = live && L && u < L.start + L.dur;
  SPEAK.who = speaking ? L.who : null; SPEAK.roar = speaking && /ROAR/.test(L.text);
  SPEAK.amp = speaking ? (L.env[Math.floor((u - L.start) * 30)] || 0) : 0;
  const cam = camera(i, u), r = raw.getContext('2d');
  r.setTransform(1, 0, 0, 1, 0, 0); r.translate(960, 540); r.scale(cam.z, cam.z); r.translate(-cam.x, -cam.y);
  CAM_INV = r.getTransform().inverse(); CAM_Z = cam.z; HEADS = HEADS_BY[i]; LOOK.page(i, r.getTransform());
  since = o => u - filmAt(i, o);
  setCue(opts(L)); SCENES[i](r, t, oldTime(i, u), OLD[i].dur);
  if (L && (opts(L).fx || []).includes('hearts')) hearts(r, i, k, L, u);
  r.setTransform(1, 0, 0, 1, 0, 0); CAM_INV = null;
  const g = cnv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'saturate(1.18) contrast(1.04) brightness(1.03)'; g.drawImage(raw, 0, 0); g.filter = 'none';
  g.globalCompositeOperation = 'multiply'; g.drawImage(paper, 0, 0); g.globalCompositeOperation = 'source-over';
  if (L && live) memory(g, L, u);
  // the character's name, the first time they speak
  if (L && FIRST[L.who] && FIRST[L.who][0] === i && FIRST[L.who][1] === k && HEADS_BY[i][L.who]) {
    const h = HEADS_BY[i][L.who], a = Math.min(clamp((u - L.start) / .3), clamp((L.start + 2.4 - u) / .4));
    if (a > 0) { const sx = (h.x - cam.x) * cam.z + 960, sy = (h.y - 120 * h.s - cam.y) * cam.z + 540;
      g.save(); g.globalAlpha = a; g.font = '600 52px Fredoka'; g.textAlign = 'center'; g.lineJoin = 'round';
      g.lineWidth = 10; g.strokeStyle = 'rgba(60,35,15,.75)'; g.strokeText(DL.names[L.who], clamp(sx, 200, 1720), clamp(sy, 70, 900));
      g.fillStyle = '#fffaf0'; g.fillText(DL.names[L.who], clamp(sx, 200, 1720), clamp(sy, 70, 900)); g.restore(); }
  }
  if (L && i > 0) { const next = k + 1 < sc.lines.length ? sc.lines[k + 1].start : sc.dur - .2;
    const text = L.who === 'narrator' ? L.text : `“${L.text}”`;
    caption(g, text, Math.min(clamp((u - L.start) / .25), clamp((next - u) / .25))); }
}
window.frame = t => {
  const ss = DL.scenes; let i = ss.length - 1; while (i > 0 && t < ss[i].start) i--;
  const fading = i > 0 && t < ss[i].start + DL.fade; LOOK.frame(t);
  drawPage(off[0], i, Math.min(t, ss[i].start + ss[i].dur), true);
  ctx.globalAlpha = 1; ctx.drawImage(off[0], 0, 0);
  if (fading) { drawPage(off[1], i - 1, t, false); ctx.globalAlpha = 1 - (t - ss[i].start) / DL.fade; ctx.drawImage(off[1], 0, 0); ctx.globalAlpha = 1; }
  LOOK.finish(ctx, t);
  const end = DL.total - t; if (end < 1.2) { ctx.fillStyle = `rgba(0,0,0,${1 - end / 1.2})`; ctx.fillRect(0, 0, 1920, 1080); }
  return cv.toDataURL('image/jpeg', .9);
};
window.ready = document.fonts.load('600 44px Fredoka').then(() => true);
</script></body></html>
