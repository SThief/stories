<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;font-weight:600;src:url(../cartoon/fonts/fredoka-latin-600-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="../cartoon/chars.js"></script><script src="../cartoon/world.js"></script><script src="../cartoon/scenes.js"></script>
<script src="../cartoon/dialogue.js"></script><script src="../cartoon/look.js"></script><script src="heroes.js"></script><script src="film.js"></script><script src="film2.js"></script><script src="film3.js"></script>
<script>
// The Wizard's Secret, remade (film.js): frame(t) draws any moment; render.js turns it into a video, and the sound is
// the first cartoon's soundtrack (same narration and voices).
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), raw = document.createElement('canvas'); raw.width = W; raw.height = H; const r = raw.getContext('2d');
const SHOWN = LINES.map((l, i) => ({ text: l.who === 'narrator' ? l.text : `“${l.text}”`, a: l.at, b: Math.min(l.at + l.dur + .9, (LINES[i + 1] || { at: 1e9 }).at - .05) }));
window.frame = t => {
  let s = SHOTS[0]; for (const q of SHOTS) if (t >= q.a) s = q;
  const u = t - s.a, cam = s.cam(u);
  r.setTransform(1, 0, 0, 1, 0, 0); r.filter = 'none'; r.globalAlpha = 1; r.globalCompositeOperation = 'source-over'; r.fillStyle = '#000'; r.fillRect(0, 0, W, H);
  r.setTransform(view(cam, 1)); CAM_Z = cam.z; CAM_INV = null; HEADS = {};
  LOOK.light(LIT[s.light], r.getTransform()); LOOK.frame(t);
  const line = LINES.find(l => t >= l.at && t < l.at + l.dur); SPEAK.who = line && line.who !== 'narrator' ? line.who : null; SPEAK.amp = line ? (line.env[Math.floor((t - line.at) * 30)] || 0) : 0;
  s.draw(r, t, u, cam);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'saturate(1.08) contrast(1.03)'; ctx.drawImage(raw, 0, 0); ctx.filter = 'none';
  LOOK.finish(ctx, t);
  ctx.fillStyle = rad(ctx, 960, 540, 420, 1250, [[0, 'rgba(20,10,20,0)'], [1, 'rgba(20,10,20,.42)']]); ctx.fillRect(0, 0, W, H);
  for (const q of SHOWN) { const k = Math.min(clamp((t - q.a) / .25), clamp((q.b - t) / .25)); if (k > 0) caption(ctx, q.text, k); }
  const fade = Math.min(clamp(t / .8), clamp((DIALOGUE.total - t) / 1.5)); if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', .9);
};
window.ready = document.fonts.load('600 34px Fredoka').then(() => true);
</script></body></html>
